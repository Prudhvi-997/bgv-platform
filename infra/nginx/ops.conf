# Reverse proxy for the Operations Portal.
# Internal VPN-only deployment per CLAUDE.md Part 4.5.

server {
    listen 80;
    server_name ops.kcheck.internal;

    # Static frontend (built ops-portal bundle)
    location / {
        root /var/www/ops-portal;
        try_files $uri /index.html;
    }

    # Ops BFF — the ONLY backend surface this portal may reach.
    location /api/ops/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
