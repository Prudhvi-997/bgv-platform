# Reverse proxy for the Candidate Portal.
# Per CLAUDE.md Part 4.5 — each portal is fronted independently.
# Candidate Portal is the public-internet-facing surface and is
# additionally WAF-fronted (not configured here).

server {
    listen 80;
    server_name bgv.client.example.com;

    location / {
        root /var/www/candidate-portal;
        try_files $uri /index.html;
    }

    # Candidate Portal BFF — the ONLY backend surface this portal may reach.
    location /api/candidate/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
